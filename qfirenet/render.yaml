databases:
  - name: qfirenet-db
    databaseName: qfirenet
    plan: free

services:
  - type: web
    name: qfirenet-backend
    runtime: docker
    rootDir: qfirenet/backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qfirenet-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_MAX_TOKENS
        value: "512"
      - key: APP_NAME
        value: QFireNet
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: "false"

  - type: web
    name: qfirenet-frontend
    runtime: static
    rootDir: qfirenet/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: qfirenet-backend
          envVarKey: RENDER_EXTERNAL_URL
